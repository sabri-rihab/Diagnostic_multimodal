services:

  # ── Postgres (Airflow backend DB) ──────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brain_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    networks:
      - brain_net

  # ── Airflow ────────────────────────────────────────────────────────────────
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    networks:
      - brain_net
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin
          --firstname Admin --lastname Admin
          --role Admin --email admin@example.com &&
        airflow webserver &
        airflow scheduler
      "

  # ── Classification API (InceptionV3 / GoogLeNet) ───────────────────────────
  api-classification:
    build:
      context: .
      dockerfile: docker/Dockerfile.classification
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - brain_net
    depends_on:
      - mlflow

  # ── Detection API (YOLOv8) ─────────────────────────────────────────────────
  api-detection:
    build:
      context: .
      dockerfile: docker/Dockerfile.detection
    ports:
      - "8002:8002"
    volumes:
      - ./models:/app/models
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - brain_net
    depends_on:
      - mlflow

  # ── Streamlit UI ───────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      API_CLASSIFICATION_URL: http://api-classification:8001
      API_DETECTION_URL: http://api-detection:8002
    networks:
      - brain_net
    depends_on:
      - api-classification
      - api-detection

networks:
  brain_net:
    driver: bridge

volumes:
  postgres_data:
